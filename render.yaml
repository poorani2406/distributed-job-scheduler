# render.yaml
databases:
  - name: djs-db
    databaseName: scheduler
    user: scheduler
    plan: free

services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: djs-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: djs-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        fromService:
          name: djs-frontend
          property: url
      - key: WORKER_CONCURRENCY
        value: 4
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: 1
      - key: HEARTBEAT_INTERVAL_SECONDS
        value: 5
      - key: STALE_JOB_TIMEOUT_SECONDS
        value: 60
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"

  # 2. React/Vite Frontend Static Site
  - type: web
    name: djs-frontend
    env: static
    plan: free
    buildCommand: npm run build
    publishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          name: djs-backend
          property: url

  # 3. Persistent Background Worker
  - type: worker
    name: djs-worker
    env: docker
    dockerfilePath: worker/Dockerfile
    plan: free
    envVars:
      - key: API_BASE_URL
        fromService:
          name: djs-backend
          property: url
      - key: WORKER_CONCURRENCY
        value: 4
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: 1
      - key: HEARTBEAT_INTERVAL_SECONDS
        value: 5
